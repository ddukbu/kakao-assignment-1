<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanilla JS Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-container">
    <section class="todo-card">
      <header class="app-header">
        <h1>Todo</h1>
        <p>주간 일정과 오늘의 할 일을 관리해보세요.</p>
      </header>

      <div class="week-header">
        <button type="button" id="previousWeekButton" class="date-button">이전 주</button>
        <strong id="selectedDateText" class="selected-date-text"></strong>
        <button type="button" id="nextWeekButton" class="date-button">다음 주</button>
      </div>

      <div id="weekDateList" class="week-date-list"></div>

      <form class="todo-form" id="todoForm">
        <input
          type="text"
          id="todoInput"
          class="todo-input"
          placeholder="할 일을 입력하세요"
        />
        <button type="submit" class="add-button">추가</button>
      </form>

      <p id="messageText" class="message-text"></p>

      <div class="filter-tabs">
        <button type="button" class="filter-button active" data-filter="all">전체</button>
        <button type="button" class="filter-button" data-filter="active">진행 중</button>
        <button type="button" class="filter-button" data-filter="completed">완료</button>
      </div>

      <ul id="todoList" class="todo-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
